services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  upstream:
    build: .
    command: uvicorn upstream.main:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"

  gateway:
    build: .
    environment:
      GATEWAY_UPSTREAM_URL: http://upstream:9000
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_API_KEYS: demo=demo-key
      # tighter limit on the search route than the default 100/min
      GATEWAY_ROUTE_LIMITS: '{"\/api\/search": {"requests": 10, "window": 60}}'
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - upstream
